
<!--%import("./filter/login.xml")-->
<!--%import("./filter/openid_login.xml")-->
<!--%import("./js/login.js")-->

<div cond="$XE_VALIDATOR_MESSAGE && $XE_VALIDATOR_ID == 'widgets/login_info/skins/xe_official/login_form/1'" class="message {$XE_VALIDATOR_MESSAGE_TYPE}">
	<p>{$XE_VALIDATOR_MESSAGE}</p>
</div>
<form id="fo_login_widget" action="{getUrl('','act','procMemberLogin')}" method="post" ruleset="@login" class="login_{$colorset}">
	<fieldset>
		<input type="hidden" name="act" value="procMemberLogin" />
		<input type="hidden" name="success_return_url" value="{htmlspecialchars(getRequestUriByServerEnviroment(), ENT_COMPAT | ENT_HTML401, 'UTF-8', false)}" />
		<input type="hidden" name="xe_validator_id" value="widgets/login_info/skins/xe_official/login_form/1" />
		<div class="idpwWrap">
			<div class="idpw">
				<input name="user_id" type="text" style="background:#fff; font-size: 0.8em; margin-bottom: 0.2em;" title="<!--@if($member_config->identifier != 'email_address')-->{$lang->user_id}<!--@else-->{$lang->email_address}<!--@end-->" />
				<input name="password" type="password" style="background:#fff; font-size: 0.8em;" title="{$lang->password}" />
				
					<input type="checkbox" name="keep_signed" id="keep_signed" value="Y" style="" />
					<label for="keep_signed" style="font-size:0.7em;">{$lang->keep_signed}</label>
				
			</div>
			<input type="image" class="button" alt="login" style="padding:0 1em 0 1em; background: #fff;" cond="$colorset" />
			<input type="submit" class="button" cond="!$colorset" value="{$lang->cmd_login}" />
            <a href="index.php?mid={$layout_info->search_mid}&act=dispMemberSignUpForm" class="button" style="padding:0 1em 0 1em; background: #fff;">{$lang->cmd_signup}</a>
            <a href="index.php?mid={$layout_info->search_mid}&act=dispMemberFindAccount" class="button" style="padding:0 1em 0 1em; background: #fff;">{$lang->cmd_find_member_account}</a>
		</div>
		<p cond="$ssl_mode" class="securitySignIn <!--@if($ssl_mode)-->SSL<!--@else-->noneSSL<!--@end-->">
			<button type="button" class="text" onclick="toggleSecuritySignIn(); return false;">{$lang->security_sign_in}</button>
		</p>
        <br />
		<p class="keep_msg" style="font-size:0.7em;">{$lang->about_keep_warning}</p>
	</fieldset>
</form>
