<a class="btn_social_login" id="btn_facebook_login" href="#login" onclick="socialBtnCheck('facebook'); return false;"><span>Facebook Login</span></a>
<a id="btn_facebook_login_function" href="#" onclick="myFacebookLogin(); return false" style="display:none;">FACEBOOK</a>



<script>
<!--@if($social_provider=='facebook')-->
//hash(#)가 있고 'access_token'이 있는 경우, XE로그인 설정(웹뷰작동형)
var hash_string = window.location.hash;
if(hash_string.length > 99){
  //로딩 아이콘 출력
  var social_loading = new sociaLoginLoading();
  //access_token 설정
  var hash_array = hash_string.split("&");
  var access_token = hash_array[0].replace("#access_token=", "");
  //헤시태그 제거
  history.replaceState({}, document.title, "{str_replace('amp;','',getFullUrl('mid',$mid))}");

  var url = "./";
  jQuery.ajax({
    type: "POST",
    url: url,
    data: "mid={$mid}&facebook_access_token="+access_token,
    success: function(data){
      location.reload();
    }
  });
}
<!--@end-->

function oauthClick(){
  jQuery('#btn_facebook_lo').click();
}
//페이스북 로그인 함수
function myFacebookLogin() {
  //로딩 아이콘 출력
  var social_loading = new sociaLoginLoading();

  //페이스북 로그인 설정(웹뷰작동형)
  var url = "./";
  jQuery.ajax({
    type: "POST",
    url: url,
    data: "ajax=y&mid={$mid}&social_provider=facebook&insert_session=y&act={$act}",
    success: function(data){
      var response = jQuery(data);
      if(response.filter("#ajax_result_text").text()){
        var result_msg = response.filter("#ajax_result_text").text();
      } else if(response.find("#ajax_result_text").text()){
        var result_msg = response.find("#ajax_result_text").text();
      }
      if(result_msg){
        location.reload();
        //IE에서 '이 페이지에서 나가겠습니까?' 창이 뜨는 문제로 인해 php 'header'로 변경함
        //var redirect_uri = encodeURI("{$redirect_uri}");
        //window.location = encodeURI("https://www.facebook.com/dialog/oauth?client_id={$social_obj->facebook_app_id}&redirect_uri="+redirect_uri+"&response_type=token&scope=email");
      }
      return false;
    }
  });
}
</script>
