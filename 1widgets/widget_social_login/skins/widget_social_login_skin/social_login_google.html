<a class="btn_social_login" id="btn_google_login" href="#login" onclick="socialBtnCheck('google'); return false;"><span>Google Login</span></a>
<a id="btn_google_login_function" href="#" onclick="myGoogleLogin(); return false" style="display:none;">SOCIAL LOGIN</a>



<script>
<!--@if($social_provider=='google')-->
//hash(#)가 있고 'access_token'이 있는 경우, XE로그인 설정(웹뷰작동형)
var hash_string = window.location.hash;
if(hash_string.length > 99){
  //로딩 아이콘 출력
  var social_loading = new sociaLoginLoading();
  //access_token 설정
  var hash_array = hash_string.split("&");
  var access_token = hash_array[0].replace("#access_token=", "");
  //헤시태그 제거
  history.replaceState({}, document.title, "{str_replace('amp;','',getFullUrl('mid',$mid))}");

  var url = "./";
  jQuery.ajax({
    type: "POST",
    url: url,
    data: "mid={$mid}&google_access_token="+access_token,
    success: function(data){
      location.reload();
    }
  });
}
<!--@end-->

//구글 로그인 함수
function myGoogleLogin() {
  //로딩 아이콘 출력
  var social_loading = new sociaLoginLoading();
  //구글 로그인 설정(웹뷰작동형)
  var url = "./";
  jQuery.ajax({
    type: "POST",
    url: url,
    data: "ajax=y&mid={$mid}&social_provider=google&insert_session=y&act={$act}",
    success: function(data){
      var response = jQuery(data);
      if(response.filter("#ajax_result_text").text()){
        var result_msg = response.filter("#ajax_result_text").text();
      } else if(response.find("#ajax_result_text").text()){
        var result_msg = response.find("#ajax_result_text").text();
      }
      if(result_msg){
        location.reload();
        //IE에서 '이 페이지에서 나가겠습니까?' 창이 뜨는 문제로 인해 php 'header'로 변경함
        //웹뷰에서 작동하기 위해, popup이 아닌 페이지 형식으로 진행
        //'redirect_uri'이 구글설정에서 등록한 것과 정확하게 같아야 함
        //var redirect_uri = encodeURI("{$redirect_uri}");
        //window.location = encodeURI("https://accounts.google.com/o/oauth2/v2/auth?response_type=token&client_id={$social_obj->google_client_id}&scope=email&redirect_uri="+redirect_uri);
      }
      return false;
    }
  });
}
</script>
