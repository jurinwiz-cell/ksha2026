<load target="./css/widget.css" />
<load target="./js/counterup.min.js" />
<load target="./js/jquery-waypoints.js" />
<div class="widgetContainer<!--@if($colorset=="black")--> black<!--@end-->">
    <dl class="widgetCounter">
        <dt>{$lang->today}:</dt>
        <dd class="counter">{number_format($today_counter->unique_visitor)}</dd>
        <dt>{$lang->yesterday}:</dt>
        <dd class="counter">{number_format($yesterday_counter->unique_visitor)}</dd>
        <dt>{$lang->total}:</dt>
        <dd class="counter">{number_format($total_counter->unique_visitor)}</dd>
    </dl>
</div>


<script>
jQuery('.counter').counterUp({
		delay: 10,
		time: 2000
	});

</script>
