[package]
name = "rpdf-desktop"
version = "0.5.0"
edition = "2021"

[lib]
name = "rpdf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rpdf-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpdf-parser = { path = "../../../crates/rpdf-parser" }
rpdf-edit = { path = "../../../crates/rpdf-edit" }
rpdf-serializer = { path = "../../../crates/rpdf-serializer" }
rpdf-core = { path = "../../../crates/rpdf-core" }
rpdf-svg = { path = "../../../crates/rpdf-svg" }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-window-state = "2.4.1"
image = { version = "0.25", features = ["tiff", "jpeg"] }
lopdf = { version = "0.40", features = ["embed_image"] }

[dev-dependencies]
tempfile = { workspace = true }
