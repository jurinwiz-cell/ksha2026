name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리즈 태그 (예: v0.5.0)"
        required: false
        default: "v0.5.0-test"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Build WASM (desktop 의존성)
        run: wasm-pack build crates/rpdf-wasm --target web

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build @rpdf/ui (desktop 의존성)
        run: pnpm --filter @rpdf/ui build

      - name: Build Tauri app (push — Release 생성)
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "rpdf ${{ github.ref_name }}"
          releaseBody: |
            ## 변경사항

            자세한 내용은 릴리즈 노트를 참조하세요.
          releaseDraft: true
          prerelease: false
          projectPath: packages/desktop
          args: ${{ matrix.args }}

      - name: Build Tauri app (workflow_dispatch — artifacts only)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          args: ${{ matrix.args }}
