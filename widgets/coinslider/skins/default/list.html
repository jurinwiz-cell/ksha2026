<script type="text/javascript">
	jQuery(document).ready(function () {
		jQuery('#coin-slider_{$widget_info->widget_division}').coinslider({
			width: parseInt('{$widget_info->thumbnail_width}', 10),
			height: parseInt('{$widget_info->thumbnail_height}', 10),
			spw: parseInt('{$widget_info->square_width}', 10),
			sph: parseInt('{$widget_info->square_height}', 10),
			delay: parseInt('{$widget_info->slide_delay}', 10),
			sDelay: parseInt('{$widget_info->square_delay}', 10),
			opacity: parseFloat('{$widget_info->content_opacity}'),
			titleSpeed: parseInt('{$widget_info->content_speed}', 10),
			effect: '{$widget_info->slide_effect}' === 'rand' ? '' : '{$widget_info->slide_effect}',
			navigation: '{$widget_info->show_navigation}' === 'Y',
			imagelist: '{$widget_info->show_imagelist}' === 'Y',
			links: '{$widget_info->hyperlink}' === 'Y',
			hoverPause: '{$widget_info->hover_pause}' === 'Y',
			uptitle: '{$widget_info->content_position}' === 'top',
			imagebutton: '{$colorset}' !== 'default',
			imagebuttontype: ('{$colorset}' === 'imagebutton01' ? 0 : ('{$colorset}' === 'imagebutton02' ? 1 : ('{$colorset}' === 'imagebutton03' ? 2 : ('{$colorset}' === 'imagebutton04' ? 3 : 0)))),
			skinsrc: '{$skin_path}'
		});
	});
</script>
