<div class="board_read">
	<!-- READ HEADER -->
	<div class="read_header">
		<h1>
		    <!--@if($oDocument->isNotice())-->
			<a class="category"><i class="icon-diamond icons"></i></a>
			<!--@else-->
			<a href="{getUrl('category',$oDocument->get('category_srl'), 'document_srl', '')}" class="category" cond="$module_info->use_category=='Y'">{$category_list[$oDocument->get('category_srl')]->title}</a>
			<!--@end-->
			<a href="{$oDocument->getPermanentUrl()}">{$oDocument->getTitle()}</a>
		</h1>
		<p class="time">
			{$oDocument->getRegdate('Y/m/d')}
		</p>
	</div>
	<!-- /READ HEADER -->
	<!-- Extra Output -->
	<div class="read_banner">
	<!--@if($oDocument->getExtraEidValue('banner_img'))-->
	<a href="{$oDocument->getExtraEidValue('banner_link')}" target="_blank">
	<img class="banner" src="{$oDocument->getExtraEidValue('banner_img')}" />
	</a>
	<!--@else-->
	<a cond="!$oDocument->isNotice()" href="{$oDocument->getExtraEidValue('banner_link')}" target="_blank">
	<block cond="$module_info->no_banner">
	<img src="{$module_info->no_banner}" />
	</block>
	<block cond="!$module_info->no_banner">
	<img src="img/no_banner.png" />
	</block>
	</a>
	<!--@end-->
	<div>{$oDocument->getExtraEidValue('banner_exp')}</div>
	<div cond="$oDocument->isNotice()">{$oDocument->getContent(false)}</div>
	</div>
	<!-- /Extra Output -->
	<!-- /READ BODY -->
	<!-- READ FOOTER -->
	<div class="read_footer">
		<div cond="$module_info->use_tag" class="tns">
			{@ $tag_list = $oDocument->get('tag_list') }
			<span class="tags" cond="count($tag_list)">
			<span style="margin-right:5px"><i class="icon-tag icons"></i></span>
				<!--@for($i=0;$i<count($tag_list);$i++)-->
					{@ $tag = $tag_list[$i]; }
					<a href="{getUrl('search_target','tag','search_keyword',$tag,'document_srl','')}" class="tag" rel="tag">{htmlspecialchars($tag)}</a>
				<!--@end-->
			</span>
		</div>
		<div class="btnArea"> 
			<a cond="$oDocument->isEditable()" class="mbr_btn" href="{getUrl('act','dispBoardWrite','document_srl',$oDocument->document_srl,'comment_srl','')}"><i class="icon-wrench icons"></i></a>
			<a cond="$oDocument->isEditable()" class="mbr_btn" href="{getUrl('act','dispBoardDelete','document_srl',$oDocument->document_srl,'comment_srl','')}"><i class="icon-trash icons"></i></a>
			<span class="etc">
				<a href="{getUrl('document_srl','')}" class="mbr_btn"><i class="icon-list icons"></i></a>
			</span>
		</div>
	</div>
	<!-- /READ FOOTER -->
</div>
