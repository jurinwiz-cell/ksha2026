  사용법:
    <?php include 'youtube-playlists.html'; ?>

  사전 준비:
    1) 아래 YT_API_KEY 에 본인의 YouTube Data API v3 키를 넣으세요.
       (Google Cloud Console → API 및 서비스 → 사용자 인증 정보)
       보안을 위해 키에 HTTP 리퍼러 제한을 거는 것을 권장합니다.
    2) PLAYLISTS 배열에 보여줄 채널/재생목록을 등록하세요.
       - playlistId 만 알아도 동작합니다 (channelId 는 라벨/그룹핑용).
       - 재생목록 ID는 유튜브 URL 의 list= 뒤 값입니다.
         예) https://www.youtube.com/playlist?list=PLxxxxxxxxxxxx
-->

  <div class="yt-pl-header">

             placeholder="채널명 · 재생목록명 · 영상 제목 검색" autocomplete="off"/>
    </label>

  <div class="yt-pl-layout">
    <section class="yt-pl-main">
      <!-- 1. 영상 플레이어 영역 -->
      <div class="yt-pl-player">
        <div id="yt-pl-empty" class="yt-pl-empty">
            영상을 선택하면 재생됩니다.
        </div>
        <iframe id="yt-pl-iframe" hidden
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
                title="YouTube player"></iframe>
      </div>

      <!-- 2. 영상 메타 정보 -->
      <div class="yt-pl-meta">
        <h3 id="yt-pl-now-title" class="yt-pl-meta-title">재생 중인 영상이 없습니다</h3>
        <span id="yt-pl-now-channel" class="yt-pl-meta-channel"></span>

      <!-- 3. 재생목록 탭 & 영상 그리드 -->
      <div class="yt-pl-content">
        <div class="yt-pl-tabs-container">
          <ul id="yt-pl-playlist-tabs" class="yt-pl-tabs"></ul>
        </div>

  <script>
  (function () {
    // ===== 설정 =====================================================
    const YT_API_KEY = ""; // ← 여기에 키 입력

    // 관리자가 미리 등록하는 채널/재생목록 목록
    // channelLabel 은 표시용입니다. playlistId 만 정확하면 동작합니다.
    const PLAYLISTS = [
      {
        channelLabel: "쏘하우스TV",
        playlistTitle: "사회주택을 말하다",
        playlistId: "PLXLxTt8xUmeqALUf1UjIxQUengi8nHuWZ"
      },
      {
        channelLabel: "쏘하우스TV",
        playlistTitle: "사회주택 이야기",
        playlistId: "PLXLxTt8xUmeqb9mtsINxSWSyB1iN1yeGC"
      }
    ];
    // ================================================================

    const $ = (id) => document.getElementById(id);
    const els = {
      status: $("yt-pl-status"),
      videoGrid: $("yt-pl-video-grid"),
      playlistTabs: $("yt-pl-playlist-tabs"),
      iframe: $("yt-pl-iframe"),
      empty: $("yt-pl-empty"),
      nowTitle: $("yt-pl-now-title"),
      nowChannel: $("yt-pl-now-channel"),
      nowLink: $("yt-pl-now-link"),
      search: $("yt-pl-search-input")
    };

    let currentPlaylistId = null;
    let currentVideos = [];
    let currentFilter = "";

    function setStatus(msg, isError) {
      els.status.textContent = msg || "";
      els.status.hidden = !msg;
      els.status.classList.toggle("is-error", !!isError);
    }

    function renderPlaylistTabs() {
      els.playlistTabs.innerHTML = "";
      PLAYLISTS.forEach((p) => {
        const li = document.createElement("li");
        li.className = "yt-pl-tab-item" + (p.playlistId === currentPlaylistId ? " is-active" : "");
        li.textContent = p.playlistTitle;
        li.addEventListener("click", () => loadPlaylist(p));
        els.playlistTabs.appendChild(li);
      });
    }

    async function fetchAllPlaylistItems(playlistId) {
      if (!YT_API_KEY || YT_API_KEY === "key") {
        throw new Error("YouTube API 키가 설정되지 않았습니다. youtube-playlists.html 파일의 YT_API_KEY 값을 채워주세요.");
      }
      const items = [];
      let pageToken = "";
      for (let page = 0; page < 5; page++) {
        const url = new URL("https://www.googleapis.com/youtube/v3/playlistItems");
        url.searchParams.set("part", "snippet");
        url.searchParams.set("maxResults", "50");
        url.searchParams.set("playlistId", playlistId);
        url.searchParams.set("key", YT_API_KEY);
        if (pageToken) url.searchParams.set("pageToken", pageToken);
        const res = await fetch(url.toString());
        if (!res.ok) {
          let detail = "";
          try { detail = (await res.json()).error?.message || ""; } catch (e) {}
          throw new Error("YouTube API 오류 (" + res.status + ") " + detail);
        }
        const data = await res.json();
        (data.items || []).forEach((it) => {
          const sn = it.snippet || {};
          const vid = sn.resourceId && sn.resourceId.videoId;
          if (!vid) return;
          if (sn.title === "Private video" || sn.title === "Deleted video") return;
          const thumbs = sn.thumbnails || {};
          // 고해상도 순서대로 시도: high -> medium -> default
          const thumbUrl = (thumbs.high ? thumbs.high.url : (thumbs.medium ? thumbs.medium.url : (thumbs.default ? thumbs.default.url : "")));
          items.push({
            videoId: vid,
            title: sn.title || "(제목 없음)",
            channelTitle: sn.videoOwnerChannelTitle || sn.channelTitle || "",
            thumb: thumbUrl
          });
        });
        pageToken = data.nextPageToken || "";
        if (!pageToken) break;
      }
      return items;
    }

    function renderVideoList() {
      els.videoGrid.innerHTML = "";
      const q = currentFilter.trim().toLowerCase();
      const filtered = q
        ? currentVideos.filter((v) =>
            v.title.toLowerCase().includes(q) ||
            v.channelTitle.toLowerCase().includes(q))
        : currentVideos;

      if (!filtered.length) {
        setStatus(currentVideos.length ? "검색 결과가 없습니다." : "재생목록이 비어있습니다.");
        return;
      }
      setStatus("");

      filtered.forEach((v) => {
        const card = document.createElement("li");
        card.className = "yt-pl-video-card";
        card.onclick = () => {
            playVideo(v);
            // 상단으로 부드럽게 스크롤
            const appEl = document.getElementById('yt-pl-app');
            if(appEl) appEl.scrollIntoView({ behavior: 'smooth' });
        };
        
        card.innerHTML = `
          <div class="yt-pl-video-thumb-wrapper">
            <img class="yt-pl-video-thumb" alt="" loading="lazy"/>
          </div>
          <div class="yt-pl-video-info">
            <div class="yt-pl-video-title">${v.title}</div>
            <div class="yt-pl-video-meta">${v.channelTitle}</div>
          </div>
        `;
        
        // 라이믹스 경로 필터 우회를 위해 src를 직접 할당
        card.querySelector('img').src = v.thumb;
        
        els.videoGrid.appendChild(card);
      });
    }

    function playVideo(v, shouldAutoplay = true) {
      const src = "https://www.youtube.com/embed/" + encodeURIComponent(v.videoId)
        + "?list=" + encodeURIComponent(currentPlaylistId)
        + (shouldAutoplay ? "&autoplay=1" : "")
        + "&rel=0";
      els.iframe.src = src;
      els.iframe.hidden = false;
      els.empty.style.display = "none";
      els.nowTitle.textContent = v.title;
      els.nowChannel.textContent = v.channelTitle;
      els.nowLink.href = "https://www.youtube.com/watch?v=" + v.videoId
        + "&list=" + currentPlaylistId;
      els.nowLink.hidden = false;

      // 선택된 카드 표시 업데이트
      els.videoGrid.querySelectorAll(".yt-pl-video-card").forEach((card) => {
        const isTarget = card.querySelector('img').src.includes(v.videoId) || card.innerText.includes(v.title);
        card.classList.toggle("is-active", isTarget);
      });
    }

    async function loadPlaylist(p, isInitial = false) {
      currentPlaylistId = p.playlistId;
      currentVideos = [];
      renderPlaylistTabs();
      setStatus("영상을 불러오는 중…");
      try {
        currentVideos = await fetchAllPlaylistItems(p.playlistId);
        renderVideoList();
        
        // 첫 영상 자동 선택
        if (currentVideos.length > 0) {
            // 초기 로딩 시에는 재생 안함(false), 그 외(탭 클릭 등)에는 자동 재생(true)
            playVideo(currentVideos[0], !isInitial);
        }
      } catch (err) {
        console.error(err);
        setStatus(err.message || "불러오기에 실패했습니다.", true);
      }
    }

    els.search.addEventListener("input", (e) => {
      currentFilter = e.target.value;
      if (currentPlaylistId) renderVideoList();
    });

    if (!PLAYLISTS.length) {
      setStatus("등록된 재생목록이 없습니다. PLAYLISTS 배열에 추가하세요.", true);
    } else {
      renderPlaylistTabs();
      // true를 전달하여 초기 로딩임을 알림 (첫 영상 자동 재생 방지)
      loadPlaylist(PLAYLISTS[0], true);
    }
  })();
  </script>
